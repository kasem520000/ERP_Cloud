# بناءُ APK عبر GitHub Actions — تطبيق مندوب التوزيع.
#
# الاستعمال: أنشئ مستودعًا جديدًا وارفع محتويات مجلّد apps/android-rep في جذرِه
# (بحيث يكون gradlew وapp/ في الجذر مباشرةً)، ثم:
#   تبويب Actions ← Build APK ← Run workflow — وبعد دقائق تجد APK في Artifacts.
#
# توقيعُ نسخة الإصدار (اختياريّ): لا تضع مفتاح التوقيع في الكود أبدًا.
#   1) أنشئ مفتاحًا محليًّا:  keytool -genkeypair -v -keystore release.keystore \
#        -alias rep -keyalg RSA -keysize 2048 -validity 10000
#   2) في Settings ← Secrets and variables ← Actions أضف:
#        KEYSTORE_BASE64  = ناتج:  base64 -w0 release.keystore   (لينكس)
#        KEYSTORE_PASSWORD = كلمة ممر المخزن
#        KEY_ALIAS         = rep
#        KEY_PASSWORD      = كلمة ممر المفتاح
#   3) شغّل الـworkflow — تُفكّ وتُستعمل تلقائيًّا.
# بدون هذه الأسرار تُوقَّع نسخةُ الإصدار بمفتاح التصحيح كي تُثبَّت مباشرةً للتجربة.

name: Build APK

on:
  workflow_dispatch: # تشغيلٌ يدويّ من تبويب Actions
  push:
    branches: [main, master]

jobs:
  build:
    name: Build debug & release APKs
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore (if configured)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: rep-app-apks
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
