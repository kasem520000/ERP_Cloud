name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'apps/android-bakery/**'
      - 'apps/android-rep/**'
      - '.github/workflows/build-android-apks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/android-bakery/**'
      - 'apps/android-rep/**'
      - '.github/workflows/build-android-apks.yml'

concurrency:
  group: android-apks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-bakery:
    name: Build Bakery Management APK (android-bakery)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android-bakery
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/android-bakery/**/*.gradle*
            apps/android-bakery/**/gradle-wrapper.properties
            apps/android-bakery/**/libs.versions.toml

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore (if configured)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/bakery-release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/bakery-release.keystore" >> "$GITHUB_ENV"

      - name: Build Release APK (android-bakery)
        shell: bash
        run: |
          set -o pipefail
          (./gradlew assembleRelease --stacktrace --no-daemon) 2>&1 | tee bakery-build.log

      - name: Surface compiler errors as annotations on failure
        if: failure()
        shell: bash
        run: |
          if [ -f bakery-build.log ]; then
            grep -E '(^e: |FAILURE:|> Task .* FAILED|\* What went wrong:|Error:)' bakery-build.log | head -n 40 | awk '{printf "%s%s", (NR%5==1 ? "::error title=BakeryBuild::" : " || "), $0; if (NR%5==0) print ""} END {if (NR%5!=0) print ""}'
          fi

      - name: Upload Bakery Release APK
        uses: actions/upload-artifact@v4
        with:
          name: bakery-app-release-apk
          retention-days: 14
          path: |
            apps/android-bakery/app/build/outputs/apk/release/*.apk

      - name: Upload Bakery build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bakery-build-log
          retention-days: 7
          if-no-files-found: ignore
          path: apps/android-bakery/bakery-build.log

  build-rep:
    name: Build Van Sales Rep APK (android-rep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android-rep
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/android-rep/**/*.gradle*
            apps/android-rep/**/gradle-wrapper.properties
            apps/android-rep/**/libs.versions.toml

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore (if configured)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/rep-release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/rep-release.keystore" >> "$GITHUB_ENV"

      - name: Build Release APK (android-rep)
        shell: bash
        run: |
          set -o pipefail
          (./gradlew assembleRelease --stacktrace --no-daemon) 2>&1 | tee rep-build.log

      - name: Surface compiler errors as annotations on failure
        if: failure()
        shell: bash
        run: |
          if [ -f rep-build.log ]; then
            grep -E '(^e: |FAILURE:|> Task .* FAILED|\* What went wrong:|Error:)' rep-build.log | head -n 40 | awk '{printf "%s%s", (NR%5==1 ? "::error title=RepBuild::" : " || "), $0; if (NR%5==0) print ""} END {if (NR%5!=0) print ""}'
          fi

      - name: Upload Rep Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rep-app-release-apk
          retention-days: 14
          path: |
            apps/android-rep/app/build/outputs/apk/release/*.apk

      - name: Upload Rep build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rep-build-log
          retention-days: 7
          if-no-files-found: ignore
          path: apps/android-rep/rep-build.log
