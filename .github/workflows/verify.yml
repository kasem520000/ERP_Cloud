name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'arena/**']

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Typecheck, Lint, Build, Test & OpenAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tee` يُبقي السجل عند الفشل، و`pipefail` يُبقي رمز الخروج صادقاً — بلا
      # `pipefail` يمرّ أي فشلٍ بهدوء لأن رمز `tee` هو ما يُقرأ.
      - name: Run full verification pipeline (pnpm verify)
        env:
          CI: 'true'
          NODE_ENV: test
        shell: bash
        run: |
          set -o pipefail
          pnpm run verify 2>&1 | tee verify.log

      # سجلّ الفشل يُرفع كملفّ: صفحة التشغيل لا تُظهر أي اختبارٍ سقط، وكان تشخيص فشلٍ
      # عابرٍ يحتاج إعادة تشغيلٍ كاملة لتخمينه.
      - name: Upload verification log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: verify.log
          retention-days: 7
          if-no-files-found: ignore
