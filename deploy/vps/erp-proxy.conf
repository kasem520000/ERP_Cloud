# /etc/nginx/snippets/erp-proxy.conf
#
# ترويسات الوكيل المشتركة بين الـAPI والواجهات. تُضمّن داخل كل `location /`.
#
# القاعدة: `X-Forwarded-*` لا تُكتب يدوياً بقيم مرسلة من العميل. بعد أن يضبط
# `real_ip` عنوان `$remote_addr` من `CF-Connecting-IP` (نطاقات Cloudflare وحدها)،
# يصبح ما نُمرّره هو العنوان الحقيقي — وما عدا ذلك تزوير.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  443;

# WebSocket / HMR — لا يضرّ في الإنتاج ويُبقي المعاينة تعمل.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $erp_connection_upgrade;

# اتصالٌ دائم إلى الخادم الخلفي: يقلّل كلفة TLS/المقبس على كل طلب.
proxy_buffering on;
proxy_buffers 16 16k;
proxy_busy_buffers_size 32k;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# لا نُعيد توجيه 3xx صادرة عن Next.js إلى عنوان داخلي.
proxy_redirect off;
