# /etc/nginx/sites-available/erpcloud
#
# سبعةُ مضيفين، خادمٌ واحد لكلٍّ، وكلها تُخدَم عبر Cloudflare (سجلات A مُوكَّلة).
#
# ── ثلاثُ قواعد تحكم هذا الملف ────────────────────────────────────────────────
#
# 1. **الـAPI وحده يعرف نفسه.** كل واجهة Next.js تُمرّر `/api/v1/*` إلى الـAPI عبر
#    `rewrites` (same-origin من المتصفّح). فلا حاجة إلى CORS بين المضيفات، ولا تُفتح
#    `api.` لمتصفّحٍ لم يُطلب منه ذلك.
# 2. **العنوان الحقيقي للعميل.** Cloudflare بروكسي، فـ`$remote_addr` هو حافة Cloudflare
#    لا الزائر. بلا `real_ip` تصير كل الطلبات من بضع عناوين ⇒ دلو سقفٍ واحد للعالم كلّه
#    (تقييد جماعي) وحقول تدقيقٍ خاطئة. لذلك يُقرأ `CF-Connecting-IP` من نطاقات Cloudflare
#    وحدها (ملف `cloudflare-ips.conf` أدناه).
# 3. **لا شيء يُخدَم على 80 ولا على منفذٍ داخلي.** 80 ⇒ 301 إلى https، والمنافذ
#    3000–3005 على loopback فقط (انظر `deploy/vps/README.md`).
#
# قبل التشغيل: `nginx -t` ثم `systemctl reload nginx`. وملف الشهادة هنا شهادة
# Cloudflare Origin CA (وليست Let's Encrypt) — صالحة 15 سنة، ولا تحتاج تجديداً دورياً،
# لكنها تعمل فقط حين يكون السجل **بروكسي** في Cloudflare (Full / strict).

# ── عناوين Cloudflare الحقيقية ───────────────────────────────────────────────
# حدّث القائمة من https://www.cloudflare.com/ips/ عند تغيّرها (نادراً).
# ضعها في /etc/nginx/conf.d/cloudflare-ips.conf بالشكل:
#
#   set_real_ip_from 173.245.48.0/20;
#   set_real_ip_from 103.21.244.0/22;
#   set_real_ip_from 103.22.200.0/22;
#   set_real_ip_from 103.31.4.0/22;
#   set_real_ip_from 141.101.64.0/18;
#   set_real_ip_from 108.162.192.0/18;
#   set_real_ip_from 190.93.240.0/20;
#   set_real_ip_from 188.114.96.0/20;
#   set_real_ip_from 197.234.240.0/22;
#   set_real_ip_from 198.41.128.0/17;
#   set_real_ip_from 162.158.0.0/15;
#   set_real_ip_from 104.16.0.0/13;
#   set_real_ip_from 104.24.0.0/14;
#   set_real_ip_from 172.64.0.0/13;
#   set_real_ip_from 131.0.72.0/22;
#   set_real_ip_from 2400:cb00::/32;
#   set_real_ip_from 2606:4700::/32;
#   set_real_ip_from 2803:f800::/32;
#   set_real_ip_from 2405:b500::/32;
#   set_real_ip_from 2405:8100::/32;
#   set_real_ip_from 2a06:98c0::/29;
#   set_real_ip_from 2c0f:f248::/32;
#   real_ip_header CF-Connecting-IP;

# ── مشترك: الترويسات التي نثق بها ونُمرّرها ──────────────────────────────────
# `X-Forwarded-For` بعد real_ip يحمل عنوان الزائر الصحيح، و`X-Forwarded-Proto` https
# دائماً لأن Cloudflare ينهي TLS. و`Host` يُمرَّر كما هو كي تعرف Next.js مضيفها.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ── الـAPI ───────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.sahabaccounting.com;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04): http2 يُفعَّل في listen. على 1.25.1+ استخدم `http2 on;` بدلاً منه.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sahabaccounting.com;

    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # سقف جسم الطلب: طلبات JSON تخضع لـ`BODY_LIMIT_BYTES` داخل الـAPI (1 MiB)،
    # بينما يسمح 68m باستيراد أرشيفات النسخ الاحتياطي (حتى 64 MiB) والمرفقات دون 413 من Nginx.
    client_max_body_size 68m;

    # الترويسة التي يضبطها الـAPI نفسه لا تُكرَّر هنا (HSTS موجود في bootstrap.ts).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # `/metrics` للتشغيل لا للعالم: يُقرأ من الشبكة الداخلية أو من الوكيل الذي يجمعه.
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://127.0.0.1:3000/metrics;
        include /etc/nginx/snippets/erp-proxy.conf;
    }

    # توثيق OpenAPI: أغلقه في الإنتاج (أو احصره على شبكة داخلية) إن لم يكن عقداً عاماً.
    location ^~ /api/docs {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/erp-proxy.conf;
        proxy_read_timeout 60s;
    }
}

# ── الواجهات الخمس ────────────────────────────────────────────────────────────
# كل واحدة كتلةٌ مستقلة: عطلُ واجهةٍ لا يمسّ الأخرى، وسجلّها مفصول.
# القالب متكرّر عن قصد (nginx لا يعرف «قالباً»)، والفرق: server_name والمنفذ.

server {
    listen 80;
    listen [::]:80;
    server_name staff.sahabaccounting.com;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04): http2 يُفعَّل في listen. على 1.25.1+ استخدم `http2 on;` بدلاً منه.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staff.sahabaccounting.com;

    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # يسمح برفع مرفقات المستندات والفواتير (FILES_MAX_UPLOAD_BYTES = 25 MiB).
    client_max_body_size 30m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # أصول Next.js مضمّنة بالبصمة في الاسم ⇒ تخزين طويل آمن، والملفّ يُبنى مرة واحدة.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/erp-proxy.conf;
        # `expires max` وحده: يضيف Cache-Control مرّة واحدة. جمعُه مع add_header
        # Cache-Control يُرسل ترويستين متعارضتين، فيتجاهل المتصفّح إحداهما عشوائياً.
        expires max;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/erp-proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sahabaccounting.com marketing.sahabaccounting.com www.sahabaccounting.com;
    return 301 https://$host$request_uri;
}

# التسويق على الجذر `sahabaccounting.com` (المطابق لـ PUBLIC_APP_URL و NEXT_PUBLIC_MARKETING_URL)
# وعلى `marketing.sahabaccounting.com` معاً لخدمة الواجهة مباشرة بلا تحويل إضافي.
server {
    # nginx 1.24 (Ubuntu 24.04): http2 يُفعَّل في listen. على 1.25.1+ استخدم `http2 on;` بدلاً منه.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sahabaccounting.com marketing.sahabaccounting.com;

    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/erp-proxy.conf;
        # `expires max` وحده: يضيف Cache-Control مرّة واحدة. جمعُه مع add_header
        # Cache-Control يُرسل ترويستين متعارضتين، فيتجاهل المتصفّح إحداهما عشوائياً.
        expires max;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/erp-proxy.conf;
    }
}

# توحيد `www.` إلى الجذر الرسمي `sahabaccounting.com`.
server {
    # nginx 1.24 (Ubuntu 24.04): http2 يُفعَّل في listen. على 1.25.1+ استخدم `http2 on;` بدلاً منه.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sahabaccounting.com;

    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://sahabaccounting.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.sahabaccounting.com;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04): http2 يُفعَّل في listen. على 1.25.1+ استخدم `http2 on;` بدلاً منه.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.sahabaccounting.com;

    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # يسمح باستيراد أرشيفات النسخ الاحتياطي عبر وكيل الإدارة (`/api/v1/platform/backups/import` حتى 64 MiB).
    client_max_body_size 68m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # لوحة المنصّة لا تُفهرس ولا تُضمَّن في إطار — وهي أخطر سطحٍ في المنظومة.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options DENY always;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/snippets/erp-proxy.conf;
        # `expires max` وحده: يضيف Cache-Control مرّة واحدة. جمعُه مع add_header
        # Cache-Control يُرسل ترويستين متعارضتين، فيتجاهل المتصفّح إحداهما عشوائياً.
        expires max;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/snippets/erp-proxy.conf;
    }
}

