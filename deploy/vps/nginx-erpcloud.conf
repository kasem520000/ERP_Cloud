# ── ما لا يخصّ أي مضيف: 444 بلا رد ───────────────────────────────────────────
# طلبٌ يصل بعنوان IP أو بمضيفٍ غير معروف لا يستحق صفحة خطأٍ تعرّف بالخادم.
# منفذ 80 يحتاج default_server خاصاً به، وإلا التقط أولُ كتلةٍ 80 في الملف (الـAPI)
# كلَّ طلبٍ بعنوان IP خام، فحوّله إلى api.sahabaccounting.com.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    return 444;
}
