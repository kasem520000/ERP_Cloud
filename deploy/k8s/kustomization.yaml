# ---------------------------------------------------------------------------
# النشر على Kubernetes — طبقةٌ واحدة (Kustomize)
#
#   kubectl apply -k deploy/k8s
#
# الترتيب داخل المُجمَّع: الاسم والمساحة ← الإعدادات والأسرار ← البيانات (Postgres/Redis)
# ← الترحيل والبذرة (Job) ← الـAPI ← الواجهات ← المدخل (Ingress).
#
# قبل التطبيق: انسخ `deploy/k8s/secret.example.yaml` إلى `secret.yaml` واملأ الأسرار، أو
# أنشئ السرّ بالأمر:
#   kubectl -n erp create secret generic erp-secrets \
#     --from-literal=POSTGRES_PASSWORD=... --from-literal=JWT_PRIVATE_KEY="$(cat jwt.key)" ...
#
# الصور: `kustomization.yaml` يثبّت الوسوم في مكانٍ واحد — بدّل `newTag` بوسم الإصدار لديك.
# ⚠️ ولا workflow في هذا المستودع يبني هذه الصور وينشرها إلى GHCR اليوم (‏`.github/workflows`
# فيه `verify.yml` وحده: typecheck/lint/build/test/OpenAPI)، فبناءُ الصور يدويّ حتى يُضاف
# workflow إصدار — وهي فجوةٌ معلَنة لا وعدٌ مكتوب:
#   docker build -f deploy/Dockerfile.api --build-arg ...            -t ghcr.io/albaraaq/cloud-saas-erp-api:<وسم> .
#   docker build -f deploy/Dockerfile.web --build-arg APP=<السطح> ... -t ghcr.io/albaraaq/cloud-saas-erp-<السطح>:<وسم> .
# وكلُّ صورةٍ مرجعيّة في `deploy/k8s/*.yaml` يجب أن يكون لها مدخلٌ في `images:` أدناه، وإلا نشر
# ‏`kubectl apply -k` الاسم الخام (`erp-<السطح>:latest`) فسحبه من Docker Hub وفشل — ويقيس ذلك
# ‏`packages/config/src/deployment-surface.spec.ts`.
# ---------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: erp

resources:
  - namespace.yaml
  - config.yaml
  - data.yaml
  - migrate-job.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
  # النسخُ الاحتياطيّ والفحصُ الدوريّ (بندُ ب٢٤) — وأمّا قواعدُ Prometheus فطبقةٌ
  # اختيارية في `overlays/monitoring/` لأنها CRD من kube-prometheus-stack ولا يجوز أن
  # يُفشل غيابُه تطبيقَ الأساس.
  - backup.yaml
  - monitoring.yaml

# وسمٌ واحد لكل الصور: `kubectl apply -k deploy/k8s` بعد بناء الإصدار.
images:
  - name: erp-api
    newName: ghcr.io/albaraaq/cloud-saas-erp-api
    newTag: latest
  - name: erp-marketing
    newName: ghcr.io/albaraaq/cloud-saas-erp-marketing
    newTag: latest
  - name: erp-staff
    newName: ghcr.io/albaraaq/cloud-saas-erp-staff
    newTag: latest
  - name: erp-platform-admin
    newName: ghcr.io/albaraaq/cloud-saas-erp-platform-admin
    newTag: latest
  - name: erp-customer-portal
    newName: ghcr.io/albaraaq/cloud-saas-erp-customer-portal
    newTag: latest
  - name: erp-bakery
    newName: ghcr.io/albaraaq/cloud-saas-erp-bakery
    newTag: latest
  # ولا مدخلَ هنا لأداة رفع النسخ (`minio/mc`): فبوابةُ `images:` في
  # `deployment-surface.spec.ts` تشترط أن يكون `newName` من سجلّ المشروع
  # (‏`ghcr.io/albaraaq/…`) — وهي صحيحة: فهذه القائمة لصور **المستودع** المبنيّة، وأمّا
  # صورُ الطرف الثالث فتُكتب في الملفّ نفسه بوسمٍ مثبّت كما `postgres:16` و`redis:7`
  # (‏`data.yaml`) و`postgres:16-alpine` و`curlimages/curl:8.10.1` (`backup.yaml`
  # و`monitoring.yaml`) و`minio/mc` هناك أيضًا.

# في الإنتاج: ثلاث نسخ للـAPI على الأقلّ، ونسختان لكل واجهة — ولكلّ سطحٍ في
# `scripts/next-run.mjs` مدخله هنا (بوابة العميل والمخابز كانتا ناقصتين).
replicas:
  - name: api
    count: 2
  - name: marketing
    count: 2
  - name: staff
    count: 2
  - name: platform-admin
    count: 2
  - name: customer-portal
    count: 2
  - name: bakery
    count: 2

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: erp
