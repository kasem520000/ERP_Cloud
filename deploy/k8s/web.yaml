# ---------------------------------------------------------------------------
# الواجهات (Next.js standalone) — النشر والخدمة والفحوصات.
#
# الأسطح الخمسة معلَنةٌ هنا: ‏marketing (3002) · staff (3001) · platform-admin (3003) ·
# customer-portal (3004) · bakery (3005). وكانت `customer-portal` فجوةً معلَنة منذ أُضيفت إلى
# المستودع (تقرير المرحلة 2) فأُغلقت، و`bakery` أُضيفت مع الواجهة القطاعية. ولا يبقى الاتّساق
# بالنيّة: `packages/config/src/deployment-surface.spec.ts` يقيس أنّ كلّ سطحٍ في
# `scripts/next-run.mjs` له Deployment وService و`images:` و`replicas:` ومدخلٌ في `ingress.yaml`
# وخدمةٌ في `docker-compose.yml` وسطرٌ في `scripts/local-start.sh` — فسطحٌ جديد بلا نشرٍ يسقط
# في الاختبار ولا يمرّ صامتاً.
#
# متغيّر `API_PROXY_TARGET` مُخبوزٌ في البناء (rewrites) — لذلك يُضبط كـbuild-arg في
# `deploy/Dockerfile.web`، ويُكرَّر هنا للاطّلاع في وقت التشغيل.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing
  namespace: erp
spec:
  selector:
    matchLabels: { app: marketing }
  template:
    metadata:
      labels: { app: marketing, app.kubernetes.io/part-of: erp }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: marketing
          image: erp-marketing:latest
          ports: [{ containerPort: 3002, name: http }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: '3002' }
            - { name: HOSTNAME, value: '0.0.0.0' }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: erp-marketing
  namespace: erp
spec:
  selector: { app: marketing }
  ports: [{ port: 3002, targetPort: 3002, name: http }]
---
