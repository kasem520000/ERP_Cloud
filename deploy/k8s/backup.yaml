# ---------------------------------------------------------------------------
# النسخُ الاحتياطيّ والاستعادة — بندُ ب٢٤ (كان: **لا نسخةَ ولا مراقبة** في `deploy/`
# ولا `infrastructure/`، وقِيس ذلك بـ`grep -rliE "backup|pg_dump|prometheus"` ⇒ لا شيء،
# وقاعدةُ البيانات StatefulSet بـPVC واحدة ⇒ فقدُها فقدُ بيانات العملاء).
#
# ثلاثُ قواعدَ لا تُكسر هنا:
#   1. **نسخةٌ لم تُختبر استعادتها ليست نسخة** — فالخطوة الثالثة في الأمر `pg_restore --list`
#      على الملفّ الذي كُتب الآن: أرشيفٌ لا يُقرأ فهرسُه ليس نسخةً بل وهمٌ، ويُفشل المهمّة.
#   2. **الاستعادةُ معلّقة (`suspend: true`)** — فتطبيقُ المجلّد لا يُشغّل محوَ قاعدةٍ أبدًا؛
#      ومن أراد استعادةً يُسمّي الملفّ ويُلغي التعليقَ (أو `kubectl create job --from=…`) وهو
#      يعرف أنّ الهدفَ سيُمحى. ولا استعادةَ بلا نسخةٍ من الحالة القائمة أولًا.
#   3. **الاحتفاظُ بالعدد لا بالأيام** (`KEEP=14`): فالحذفُ يطال النسخَ القديمة وحدها،
#      ولا يلمس بياناتٍ حيّة.
#
# والأداةُ المحليّة المكافئة `pnpm db:backup` / `db:restore` / **`db:drill`** (اختبارُ
# استعادةٍ كامل: نسخة ← قاعدةٌ مؤقّتة ← ترحيل ← استعادة ← مقارنةُ العدّ ← حذف المؤقّتة)،
# وقِيس `db:drill` أخضر: ‏٢٨٩ جداول / ٣٠٦٥ صفوفًا والعدُّ مطابقٌ في كلّ جدول.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: erp-backups
  namespace: erp
  labels: { app.kubernetes.io/component: backup, app.kubernetes.io/part-of: erp }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 20Gi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: erp-db-backup
  namespace: erp
  labels: { app.kubernetes.io/component: backup, app.kubernetes.io/part-of: erp }
spec:
  # ‏٠٢:١٥ UTC يوميًّا — بعد نافذةِ انخفاض الاستعمال، وقبل بداية العمل المحلّيّ.
  schedule: '15 2 * * *'
  concurrencyPolicy: Forbid          # نسختان معًا على القاعدة نفسها تُنتجان ملفًّا مشطورًا
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7          # يُبقى الفشلُ مرئيًّا أسبوعًا لا يُنسى
  startingDeadlineSeconds: 3600      # إن فاتت النافذةُ (عنقودٌ مقفل) تُنفَّذ متأخّرةً لا أن تُترك
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        metadata:
          labels: { app: erp-db-backup, app.kubernetes.io/part-of: erp }
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70            # مستخدم postgres في صورة alpine
            runAsGroup: 70
            fsGroup: 70              # فيُكتب على الـPVC بلا رفض أذونات
          containers:
            - name: backup
              # ‏وسمٌ مثبّت لا `latest`: فنسخةُ `pg_dump` يجب أن تكون ≥ نسخة الخادم
              # (‏postgres:16 في `data.yaml`) وإلا رفضت الأرشفة.
              image: postgres:16-alpine
              command: ['/bin/sh', '-eu', '-c']
              args:
                - |
                  STAMP=$(date -u +%Y%m%dT%H%M%SZ)
                  FILE="/backups/${POSTGRES_DB}-${STAMP}.dump"
                  echo "↻ pg_dump -Fc → ${FILE}"
                  pg_dump -Fc --no-owner \
                    -h erp-postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -f "$FILE"
                  SIZE=$(wc -c < "$FILE")
                  test "$SIZE" -gt 0 || { echo "✗ نسخةٌ فارغة"; exit 1; }

                  # (١) **التحقّق**: فهرسُ الأرشيف يُقرأ وعددُ عناصره معقول — فنسخةٌ
                  # لا يُقرأ فهرسُها ليست نسخة، ويُسجَّل عددُ الجداول في السطر نفسه.
                  echo "↻ التحقّقُ بالأرشيف (‏pg_restore --list)"
                  pg_restore --list "$FILE" > /tmp/toc.txt
                  ENTRIES=$(grep -Ec '^[0-9]+; ' /tmp/toc.txt || true)
                  test "$ENTRIES" -gt 100 || { echo "✗ فهرسٌ أصغرُ من المتوقع: ${ENTRIES} عنصرًا"; exit 1; }
                  TABLES=$(grep -Ec 'TABLE DATA ' /tmp/toc.txt || true)
                  echo "✓ نسخةٌ صالحة: ${SIZE} بايت · ${ENTRIES} عنصرًا · ${TABLES} جدولَ بيانات"

                  # (٢) **الاحتفاظ**: آخر KEEP نسخة تُبقى والأقدمُ تُحذف (الملفّاتُ لا البيانات).
                  ls -1t /backups/*.dump | tail -n +$(( KEEP + 1 )) | while read -r OLD; do
                    rm -f -- "$OLD"
                    echo "  🧹 حُذفت النسخةُ القديمة $(basename "$OLD")"
                  done

                  # (٣) **الإعلان**: سطرٌ واحدٌ تقرأه المراقبةُ (‏monitoring.yaml) أو جامِعُ
                  # السجلات، وفيه اسمُ الملفّ وحجمُه — فسجلٌّ بلا اسمٍ لا يُستعاد منه.
                  DUMPS=$(ls -1 /backups/*.dump | wc -l)
                  echo "✓ backup ok file=$(basename "$FILE") bytes=${SIZE} tables=${TABLES} dumps=${DUMPS}/${KEEP}"

                  # (٤) علامةُ «جاهزٌ للرفع»: الحاويتان في Podٍ واحدٍ ولا ترتيبَ بينهما،
                  # فحاويةُ الرفع تنتظر هذه العلامةَ (لا أن تفترض أنّ التفريغَ تمّ) — وتُكتب
                  # **بعد** التحقّق من الأرشيف، فلا يُرفع ملفٌّ لم يُقرأ فهرسُه.
                  echo "$(basename "$FILE")" > /backups/.ready
              env:
                - { name: POSTGRES_DB, value: app }
                - { name: POSTGRES_USER, value: postgres }
                - { name: KEEP, value: '14' }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: erp-secrets, key: POSTGRES_PASSWORD } }
              volumeMounts:
                - { name: backups, mountPath: /backups }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 1000m, memory: 1Gi }
            # ── الرفعُ إلى تخزينٍ خارج العنقود ────────────────────────────────
            # لماذا: ‏PVC داخل العنقود **ليست نسخةً احتياطية** — فإن ضاعت أقراصُ العقدة أو
            # حُذف حجمُها ضاعت النسخُ معها، وهذا بندُ ب٢٤/٣ وقرارُ صاحبِ العمل (‏S3‑متوافق).
            #
            # السرُّ `erp-backup-s3` منفصلٌ عن `erp-secrets` ومفاتيحُه **اختيارية** في التعريف
            # حتى لا يفشل `apply -k` بغيابه — لكنّ غيابَه يُفشل المهمّةَ صراحةً (‏REQUIRE_OFFCLUSTER=1):
            # فنسخةٌ بقيت داخل العنقود وحده يجب أن تُرى فشلًا لا نجاحًا صامتًا. وأنشِئ السرَّ بـ:
            #   kubectl -n erp create secret generic erp-backup-s3 \
            #     --from-literal=S3_ENDPOINT=https://s3.example.com \
            #     --from-literal=S3_BUCKET=erp-backups --from-literal=S3_REGION=us-east-1 \
            #     --from-literal=S3_ACCESS_KEY=… --from-literal=S3_SECRET_KEY=… \
            #     --from-literal=S3_PATH_STYLE=false
            #
            # والصورةُ من طرفٍ ثالث فتُكتب هنا بوسمٍ مثبّت (كعرف `postgres:16` في `data.yaml`)
            # ولا تدخل `kustomization.yaml`: فقائمةُ `images:` هناك لصور المستودع المبنيّة
            # وبوابتُها تشترط `ghcr.io/albaraaq/…`. ⚠️ ووسمُ `mc` **لم يُتحقّق من وجوده في
            # بيئة الكتابة** (لا Docker ولا وصولَ إلى سجلّ الصور) — فثبّت وسمًا موجودًا عندك
            # أو اعكسه إلى مرآتك، ولا تستعمل `latest` لأداةٍ تحمل نسخَك.
            - name: upload
              image: minio/mc:RELEASE.2024-10-08T09-37-26Z
              command: ['/bin/sh', '-eu', '-c']
              args:
                - |
                  # (١) انتظر علامةَ الجاهز (٣٠ دقيقة كحدٍّ أقصى، ثمّ فشلٌ لا انتظارٌ أبديّ)
                  i=0
                  while [ ! -s /backups/.ready ]; do
                    i=$((i + 1))
                    [ "$i" -gt 360 ] && { echo "✗ لم تظهر علامةُ الجاهز خلال ٣٠ دقيقة"; exit 1; }
                    sleep 5
                  done
                  FILE="/backups/$(cat /backups/.ready)"
                  test -f "$FILE" || { echo "✗ العلامةُ تشير إلى ملفٍّ غير موجود: $FILE"; exit 1; }
                  echo "↻ رفعُ $(basename "$FILE") إلى ${S3_BUCKET:-<غير مضبوط>}"

                  # (٢) بلا إعدادٍ خارجيّ: فشلٌ صريح لا نجاحٌ صامت (قرارُ صاحبِ العمل)
                  if [ -z "${S3_BUCKET:-}" ] || [ -z "${S3_ACCESS_KEY:-}" ] || [ -z "${S3_SECRET_KEY:-}" ]; then
                    echo "✗ S3_BUCKET/S3_ACCESS_KEY/S3_SECRET_KEY غير مضبوطة (السرّ erp-backup-s3)"
                    echo "  والنسخةُ داخل العنقود وحده ليست نسخةً احتياطية — فأنشئ السرَّ أو أَزل"
                    echo "  هذه الحاوية وأنت تعرف أنّك بلا نسخةٍ خارجيّة."
                    [ "${REQUIRE_OFFCLUSTER:-1}" = "1" ] && exit 1
                    echo "⚠ REQUIRE_OFFCLUSTER=0 — فيُتخطّى الرفعُ ويُترك الخطرُ معلَنًا"
                    rm -f /backups/.ready
                    exit 0
                  fi

                  # (٣) الرفعُ والتحقّقُ منه والاحتفاظُ على الطرف الآخر
                  mc alias set offcluster "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY" \
                    ${S3_REGION:+--region "$S3_REGION"} \
                    $([ "${S3_PATH_STYLE:-false}" = "true" ] && echo --api S3v4 || true)
                  mc cp "$FILE" "offcluster/${S3_BUCKET}/$(basename "$FILE")"
                  mc stat "offcluster/${S3_BUCKET}/$(basename "$FILE")" > /dev/null \
                    || { echo "✗ الرفعُ لم يُتحقّق منه على الطرف الآخر"; exit 1; }
                  echo "✓ رُفعت وتحُقّق منها"
                  mc rm --older-than "${KEEP_DAYS:-14}"d "offcluster/${S3_BUCKET}/" || true
                  rm -f /backups/.ready
                  echo "✓ upload ok bucket=${S3_BUCKET} file=$(basename "$FILE")"
              env:
                - { name: REQUIRE_OFFCLUSTER, value: '1' }
                - { name: KEEP_DAYS, value: '30' }
                - name: S3_ENDPOINT
                  valueFrom: { secretKeyRef: { name: erp-backup-s3, key: S3_ENDPOINT, optional: true } }
                - name: S3_BUCKET
                  valueFrom: { secretKeyRef: { name: erp-backup-s3, key: S3_BUCKET, optional: true } }
                - name: S3_REGION
                  valueFrom: { secretKeyRef: { name: erp-backup-s3, key: S3_REGION, optional: true } }
                - name: S3_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: erp-backup-s3, key: S3_ACCESS_KEY, optional: true } }
                - name: S3_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: erp-backup-s3, key: S3_SECRET_KEY, optional: true } }
                - name: S3_PATH_STYLE
                  valueFrom: { secretKeyRef: { name: erp-backup-s3, key: S3_PATH_STYLE, optional: true } }
              volumeMounts:
                - { name: backups, mountPath: /backups }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: erp-backups }
---
# ---------------------------------------------------------------------------
# مهمّةُ الاستعادة — **معلّقة**. تُشغَّل يدويًّا عند الحاجة:
#
#   kubectl -n erp create job erp-db-restore-manual --from=job/erp-db-restore-template \
#     -- /bin/sh -c '…'        # أو: عدّل RESTORE_FILE ثمّ `suspend: false` وطبّق
#
# وقبلها **انسخ الحالةَ القائمة** (`kubectl -n erp exec …` أو شغّل المهمّةَ `erp-db-backup`
# يدويًّا): فالاستعادةُ `--clean --if-exists` تمحو ما في القاعدة الهدف، ومن يستعيد بلا نسخةٍ
# من الحاضر يخسر الاثنين معًا. وأمّا `RESTORE_FILE` فيُرفض فارغًا (لا استعادةُ «أحدث ملفّ»
# ضمنيًّا — فالاسمُ قرارٌ يُتّخذ صراحةً).
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: erp-db-restore-template
  namespace: erp
  labels: { app.kubernetes.io/component: restore, app.kubernetes.io/part-of: erp }
spec:
  suspend: true                      # ← فلا يُشغَّل بالتطبيق، بل بقرار
  backoffLimit: 0                    # الاستعادةُ لا تُعاد تلقائيًّا: نصفُ استعادةٍ أسوأ من لا شيء
  template:
    metadata:
      labels: { app: erp-db-restore, app.kubernetes.io/part-of: erp }
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70 }
      containers:
        - name: restore
          image: postgres:16-alpine
          command: ['/bin/sh', '-eu', '-c']
          args:
            - |
              test -n "${RESTORE_FILE:-}" || { echo "✗ RESTORE_FILE فارغ — فاسمُ النسخة قرارٌ صريح"; exit 2; }
              FILE="/backups/${RESTORE_FILE}"
              test -f "$FILE" || { echo "✗ لا ملفّ ${FILE} — والموجود:"; ls -1 /backups || true; exit 2; }
              echo "⚠ استعادةُ ${FILE} إلى ${POSTGRES_DB} — سيمحو ما فيها"
              pg_restore --list "$FILE" > /dev/null   # يُقرأ فهرسُها قبل المحو
              pg_restore --clean --if-exists --no-owner --no-privileges \
                -h erp-postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" "$FILE"
              echo "↻ التحقّقُ بالعدّ بعد الاستعادة"
              psql -h erp-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc \
                "SELECT 'tenants=' || count(*) FROM tenants"
              psql -h erp-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc \
                "SELECT 'migrations=' || count(*) FROM erp_migrations"
              echo "✓ استُعيدت ${RESTORE_FILE}"
          env:
            - { name: POSTGRES_DB, value: app }
            - { name: POSTGRES_USER, value: postgres }
            - { name: RESTORE_FILE, value: '' }       # ← يُملأ يدويًّا باسم النسخة
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: erp-secrets, key: POSTGRES_PASSWORD } }
          volumeMounts:
            - { name: backups, mountPath: /backups }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 1Gi }
      volumes:
        - name: backups
          persistentVolumeClaim: { claimName: erp-backups }
